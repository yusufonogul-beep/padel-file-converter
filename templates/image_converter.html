{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Resim Dönüştürücü</h1>
    <p class="text-center text-gray-600 mb-6">
        PNG, JPG, WebP, GIF, BMP ve TIFF formatları arasında dönüşüm yapın. Maksimum dosya boyutu 50 MB.
    </p>

    <!-- Ad Slot: Header Banner -->
    <div class="mb-8">
        <div class="bg-gray-100 h-16 flex items-center justify-center rounded-md">
            <span class="text-gray-500 text-sm">Reklam Alanı (Leaderboard)</span>
        </div>
    </div>

    <form action="/image-converter" method="post" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-md">
        <div class="mb-4">
            <label for="imageFile" class="block text-sm font-medium text-gray-700 mb-2">Resim Dosyanızı Seçin</label>
            <input type="file" name="file" id="imageFile" accept=".png,.jpg,.jpeg,.gif,.bmp,.tiff,.webp" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100">
        </div>
        <div class="mb-4">
            <label for="targetFormat" class="block text-sm font-medium text-gray-700 mb-2">Hedef Format</label>
            <select name="target_format" id="targetFormat" class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <option value="">Format Seçin</option>
                <option value="png">PNG</option>
                <option value="jpg">JPG</option>
                <option value="jpeg">JPEG</option>
                <option value="gif">GIF</option>
                <option value="bmp">BMP</option>
                <option value="tiff">TIFF</option>
                <option value="webp">WEBP</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition">
            Dönüştür ve İndir
        </button>
    </form>

    <!-- Ad Slot: Inline Rectangle -->
    <div class="mt-8">
        <div class="bg-gray-100 h-48 flex items-center justify-center rounded-md">
            <span class="text-gray-500 text-sm">Reklam Alanı (Rectangle)</span>
        </div>
    </div>
</div>
{% endblock %}
