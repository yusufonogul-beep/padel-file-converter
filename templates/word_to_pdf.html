{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Word ➜ PDF Dönüştürücü</h1>
    <p class="text-center text-gray-600 mb-6">
        Word belgelerinizi (.doc, .docx) PDF formatına dönüştürün. Maksimum dosya boyutu 50 MB.
    </p>

    <!-- Ad Slot: Header Banner -->
    <div class="mb-8">
        <div class="bg-gray-100 h-16 flex items-center justify-center rounded-md">
            <span class="text-gray-500 text-sm">Reklam Alanı (Leaderboard)</span>
        </div>
    </div>

    <form action="/word-to-pdf" method="post" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-md">
        <div class="mb-4">
            <label for="wordFile" class="block text-sm font-medium text-gray-700 mb-2">Word Dosyanızı Seçin</label>
            <input type="file" name="file" id="wordFile" accept=".doc,.docx" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-medium py-3 px-6 rounded-lg transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
            Dönüştür ve İndir
        </button>
    </form>

    <!-- Ad Slot: Inline Rectangle -->
    <div class="mt-8">
        <div class="bg-gray-100 h-48 flex items-center justify-center rounded-md">
            <span class="text-gray-500 text-sm">Reklam Alanı (Rectangle)</span>
        </div>
    </div>
</div>
{% endblock %}
