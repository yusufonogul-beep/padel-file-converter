{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">PDF Birleştir</h1>
    <p class="text-center text-gray-600 mb-6">
        Birden fazla PDF dosyasını tek bir PDF'te birleştirin. Dosyalar yüklendiği sırada birleştirilir.
    </p>

    <!-- Ad Slot: Header Banner -->
    <div class="mb-8">
        <div class="bg-gray-100 h-16 flex items-center justify-center rounded-md">
            <span class="text-gray-500 text-sm">Reklam Alanı (Leaderboard)</span>
        </div>
    </div>

    <form action="/merge-pdf" method="post" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-md">
        <div class="mb-4">
            <label for="pdfFiles" class="block text-sm font-medium text-gray-700 mb-2">PDF Dosyalarınızı Seçin (En Az 2, Birden Fazla)</label>
            <input type="file" name="files" id="pdfFiles" accept=".pdf" multiple required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition">
            Birleştir ve İndir
        </button>
    </form>

    <!-- Ad Slot: Inline Rectangle -->
    <div class="mt-8">
        <div class="bg-gray-100 h-48 flex items-center justify-center rounded-md">
            <span class="text-gray-500 text-sm">Reklam Alanı (Rectangle)</span>
        </div>
    </div>
</div>
{% endblock %}
