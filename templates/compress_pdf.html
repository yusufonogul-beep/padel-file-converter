{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">PDF Sıkıştır</h1>
    <p class="text-center text-gray-600 mb-6">
        PDF dosya boyutunu küçültün. Kalite ayarı ile boyut/kalite dengesini kontrol edin.
    </p>

    <!-- Ad Slot: Header Banner -->
    <div class="mb-8">
        <div class="bg-gray-100 h-16 flex items-center justify-center rounded-md">
            <span class="text-gray-500 text-sm">Reklam Alanı (Leaderboard)</span>
        </div>
    </div>

    <form action="/compress-pdf" method="post" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-md">
        <div class="mb-4">
            <label for="pdfFile" class="block text-sm font-medium text-gray-700 mb-2">PDF Dosyanızı Seçin</label>
            <input type="file" name="file" id="pdfFile" accept=".pdf" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100">
        </div>
        <div class="mb-4">
            <label for="quality" class="block text-sm font-medium text-gray-700 mb-2">Sıkıştırma Kalitesi (1-100)</label>
            <input type="number" name="quality" id="quality" value="50" min="1" max="100" class="block w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
            <p class="text-xs text-gray-500 mt-1">Daha düşük = daha küçük dosya. 50 dengeli, 30 agresif, 80 hafif.</p>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition">
            Sıkıştır ve İndir
        </button>
    </form>

    <!-- Ad Slot: Inline Rectangle -->
    <div class="mt-8">
        <div class="bg-gray-100 h-48 flex items-center justify-center rounded-md">
            <span class="text-gray-500 text-sm">Reklam Alanı (Rectangle)</span>
        </div>
    </div>
</div>
{% endblock %}
